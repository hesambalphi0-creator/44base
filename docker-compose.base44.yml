# Base44 sandbox runbook for HI SARMA.
#
# Development-oriented by design: the app runs FROM THE CLONED SOURCE via the Vite dev
# server (live reload), never from a prebuilt image. Dependencies are installed inside
# the container on startup, after the bind mount is available, using the lockfile when
# one is present.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    labels:
      base44.project: HI SARMA
      base44.kind: web
      base44.port: "3000"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      # Keep container-installed dependencies out of the host checkout.
      - hi-sarma-node-modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts (platform-provided).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        exec npx vite --host 0.0.0.0 --port 5173
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  hi-sarma-node-modules:
